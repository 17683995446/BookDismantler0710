version: "3.9"

services:
  book-dismantler:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 上传和输出持久化
      - book-data:/app/output
      # 配置文件挂载（.env）
      - ./.env:/app/.env:ro
    environment:
      - BOOK_DISMANTLER_OUTPUT_DIR=/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  book-data:
