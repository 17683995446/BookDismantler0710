[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-dismantler"
version = "0.1.0"
description = "AI 驱动的开源拆书工具：将电子书拆解为思维导图、知识卡片、信息图、结构化笔记等多种知识形态"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Book Dismantler Contributors"}]
keywords = ["book", "ai", "knowledge", "mindmap", "card", "infographic", "dismantle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "typing_extensions>=4.7",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openai>=1.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tiktoken>=0.6",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
export = [
    "playwright>=1.42",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-pyyaml",
    "types-beautifulsoup4",
    "fpdf2>=2.7",
    "reportlab>=4.0",
]

[project.scripts]
book-dismantler = "book_dismantler.cli.main:app"

[project.urls]
Repository = "https://github.com/your/book-dismantler"

[tool.hatch.build.targets.wheel]
packages = ["src/book_dismantler"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/book_dismantler/rendering/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ebooklib.*", "pdfplumber.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=book_dismantler --cov-report=term-missing --cov-fail-under=75"
# 前端模块测试通过 Node.js 独立运行（tests/frontend/test-modules.mjs），
# pytest 不收集 JS 文件，避免 ModuleNotFoundError。
collect_ignore_glob = ["tests/frontend/*", "tests/frontend/**/*"]
markers = [
    "live: tests that call real LLM APIs (deselect with -m 'not live')",
    "slow: tests that take longer than 1s",
]

[tool.coverage.run]
source = ["src/book_dismantler"]
omit = ["*/tests/*"]
